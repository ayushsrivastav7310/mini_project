{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="display-1 text-primary fw-bold"><i class="bi bi-question-circle"></i> 404</div>
    <h2 class="h4 mt-3 fw-bold text-dark">Medical Waste Resource Not Found</h2>
    <p class="text-muted">The record, report, or tracking page you requested could not be located in the hospital registry.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 mt-2">
      <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
