{% extends "base.html" %}

{% block title %}400 - Bad Request{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="display-1 text-warning fw-bold"><i class="bi bi-x-circle"></i> 400</div>
    <h2 class="h4 mt-3 fw-bold text-dark">Invalid Waste Data Request</h2>
    <p class="text-muted">The request sent to the biomedical waste processor contains missing or invalid parameters.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 mt-2">
      <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
