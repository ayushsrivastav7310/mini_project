{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="display-1 text-warning fw-bold"><i class="bi bi-exclamation-triangle"></i> 500</div>
    <h2 class="h4 mt-3 fw-bold text-dark">System Fault Encountered</h2>
    <p class="text-muted">An unexpected internal server event occurred. The event has been captured in system audit logs.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 mt-2">
      <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
